# MOTERVA judge environment — single-instance AWS stack (issues #17/#19).
#
# Provisioned BY deploy/aws/bootstrap.sh (never by hand): it resolves the
# default-VPC subnets, creates the Secrets Manager secret, provisions
# Cognito, and runs `aws cloudformation deploy` with these parameters.
#
# What this stack contains (nothing more):
#   - one t3.micro EC2 instance, Amazon Linux 2023, SSM-managed (no SSH keys)
#   - SSM Session Manager for operations (deploy workflow runs commands here)
#   - dedicated encrypted 20 GB gp3 data volume for the SQLite ledger,
#     surviving instance replacement (reattach, not data loss)
#   - least-privilege instance role: ECR pull (2 repos, IMMUTABLE tags),
#     SecretsManager Get on ONE secret ARN, CloudWatch put metrics (namespace
#     moterva), SSM core, CloudWatch Agent
#   - security group: 443 + 80 (ACME HTTP-01) only; no SSH ingress at all
#   - Elastic IP (stable judge URL)
#   - ECR repositories (immutable tags) the CI deploy workflow pushes to
#   - a monthly cost Budget with alert emails (billing guardrail)
#   - status-check alarm + SNS alert topic
#   - user-data: Docker/compose install, ledger volume mount (nofail), swap,
#     Secrets Manager env fetch, /opt/moterva update helper — cfn-signals
#     success only after Docker is live (stack CREATE waits)
AWSTemplateFormatVersion: '2010-09-09'
Description: MOTERVA judge environment — one EC2 + Caddy TLS + SQLite on encrypted EBS + SSM + billing guardrails

Parameters:
  MotervaSecretArn:
    Type: String
    Description: ARN of the moterva/production secret (env values live here, never in git).
  MotervaSecretName:
    Type: String
    Default: moterva/production
  FounderEmail:
    Type: String
    Description: Billing alarm email (budget 80% actual + 100% forecast).
  MonthlyBudgetLimit:
    Type: Number
    Default: 12
    Description: USD monthly budget threshold (expected steady-state spend ~$10).
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: One default-VPC subnet for the instance.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]

Resources:
  # ------------------------------------------------------------ ECR
  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: moterva-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
  WebRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: moterva-web
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }

  # ------------------------------------------------------------ IAM
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: moterva-judge-instance
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # SSM Session Manager: the ONLY operational access (no SSH keys, no
        # SSH ingress) and the channel the deploy workflow uses.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: moterva-judge-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: 'ecr:GetAuthorizationToken', Resource: '*' }
              - Effect: Allow
                Action:
                  - 'ecr:BatchGetImage'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:DescribeRepositories'
                Resource:
                  - !GetAtt ApiRepository.Arn
                  - !GetAtt WebRepository.Arn
              - Effect: Allow
                Action: 'secretsmanager:GetSecretValue'
                Resource: !Ref MotervaSecretArn
              - Effect: Allow
                Action: 'cloudwatch:PutMetricData'
                Resource: '*'
                Condition:
                  StringEquals: { 'cloudwatch:namespace': 'moterva' }
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: moterva-judge-instance-profile
      Roles: [!Ref InstanceRole]

  # ------------------------------------------------------------ Network
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: moterva-judge-sg
      GroupDescription: MOTERVA judge edge — HTTPS + ACME HTTP-01 only; no SSH ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  # ------------------------------------------------------------ Compute
  JudgeInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      Tags:
        - { Key: Name, Value: moterva-judge }
        - { Key: moterva:role, Value: judge }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 8, VolumeType: gp3, Encrypted: true }
        - DeviceName: /dev/xvdf
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: false }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker jq
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          # Ledger home on the dedicated encrypted volume (survives instance
          # replacement: stop instance, detach, attach to a new instance,
          # restart — same financial journal).
          if ! blkid /dev/xvdf; then mkfs -t xfs /dev/xvdf; fi
          mkdir -p /var/lib/moterva /opt/moterva
          mount /dev/xvdf /var/lib/moterva || true
          grep -q xvdf /etc/fstab || echo '/dev/xvdf /var/lib/moterva xfs defaults,nofail 0 2' >> /etc/fstab
          chown -R 1000:1000 /var/lib/moterva

          # 1 GB safety swap (images are CI-built; runtime fits the micro)
          if ! swapon --show=NAME --noheadings | grep -q swapfile; then
            fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          # Production env: fetched from Secrets Manager by the instance role,
          # converted to KEY=VALUE lines, never baked into user-data or committed.
          # /opt/moterva/refresh-env.sh re-runs this at any time (bootstrap
          # --refresh-env / founder adds provider credentials later).
          cat > /opt/moterva/refresh-env.sh <<'EOR'
          #!/bin/bash
          set -euo pipefail
          aws secretsmanager get-secret-value --secret-id ${MotervaSecretName} --query SecretString --output text \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' > /opt/moterva/production.env
          chmod 600 /opt/moterva/production.env
          cd /opt/moterva
          SHA=$(cat .current-sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            MOTERVA_RELEASE_SHA="$SHA" docker compose -f compose.production.yml up -d api
          fi
          EOR
          chmod +x /opt/moterva/refresh-env.sh
          /opt/moterva/refresh-env.sh

          # Update helper — the deploy workflow and rollback both run exactly
          # this with one argument: the immutable release-SHA image tag.
          cat > /opt/moterva/update.sh <<'EOS'
          #!/bin/bash
          set -euo pipefail
          SHA="$1"
          [[ "$SHA" =~ ^[0-9a-f]{7,64}$ ]] || { echo "refusing non-SHA tag: $SHA"; exit 2; }
          cd /opt/moterva
          aws ecr get-login-password | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          MOTERVA_RELEASE_SHA="$SHA" docker compose -f compose.production.yml pull
          MOTERVA_RELEASE_SHA="$SHA" docker compose -f compose.production.yml up -d --remove-orphans
          echo "$SHA" > /opt/moterva/.current-sha
          for i in $(seq 1 60); do
            sleep 2
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "healthy at $SHA"; exit 0
            fi
          done
          echo "health check failed at $SHA"; exit 1
          EOS
          chmod +x /opt/moterva/update.sh

          # Signal stack completion only when Docker is genuinely live.
          dnf install -y aws-cfn-bootstrap || true
          /opt/aws/apitools/cfn-init/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource JudgeWaitHandle --region ${AWS::Region}

  JudgeWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle
  JudgeWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: JudgeInstance
    Properties:
      Handle: !Ref JudgeWaitHandle
      Timeout: '600'
      Count: 1

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: moterva-judge }]
  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref JudgeInstance
      AllocationId: !GetAtt ElasticIP.AllocationId

  # ------------------------------------------------------------ Alarms
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: moterva-judge-alerts
      Subscription:
        - { Endpoint: !Ref FounderEmail, Protocol: email }
  StatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: moterva-judge-status-check
      AlarmActions: [!Ref AlertTopic]
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{ Name: InstanceId, Value: !Ref JudgeInstance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

  # ------------------------------------------------- Billing guardrail
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: moterva-judge-monthly
        BudgetLimit: { Amount: !Ref MonthlyBudgetLimit, Unit: USD }
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref FounderEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref FounderEmail }

Outputs:
  ElasticIP:
    Value: !Ref ElasticIP
    Description: Point the judge DNS A record at this address.
  InstanceId:
    Value: !Ref JudgeInstance
  ApiRepositoryUri:
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/moterva-api'
  WebRepositoryUri:
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/moterva-web'
  InstanceRoleArn:
    Value: !GetAtt InstanceRole.Arn
