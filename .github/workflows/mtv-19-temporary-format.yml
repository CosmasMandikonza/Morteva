name: MTV-19 temporary branch formatter
on:
  push:
    branches:
      - feat/mtv-19-connected-golden-path
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only integration files
        run: |
          npx prettier --write apps/api/src/integration apps/api/test/integration apps/web/src/lib/api.ts apps/web/src/screens/DecisionRoom.tsx e2e/physical-decision.spec.ts packages/planner/src/candidates.ts packages/planner/src/contracts.ts packages/planner/src/evidence.ts packages/planner/src/evaluate.ts packages/planner/src/validate.ts packages/planner/test/physical-safety.test.ts apps/api/src/app.ts apps/api/package.json apps/api/tsconfig.json
      - name: Commit formatting only to this work branch
        run: |
          git add apps/api/src/integration apps/api/test/integration apps/web/src/lib/api.ts apps/web/src/screens/DecisionRoom.tsx e2e/physical-decision.spec.ts packages/planner/src/candidates.ts packages/planner/src/contracts.ts packages/planner/src/evidence.ts packages/planner/src/evaluate.ts packages/planner/src/validate.ts packages/planner/test/physical-safety.test.ts apps/api/src/app.ts apps/api/package.json apps/api/tsconfig.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(#19): format integrated code with repository Prettier"
            git push origin HEAD:feat/mtv-19-connected-golden-path
          fi
