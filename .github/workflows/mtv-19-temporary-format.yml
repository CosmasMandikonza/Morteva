name: MTV-19 temporary branch formatter
on:
  push:
    branches:
      - feat/mtv-19-connected-golden-path
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/routes.ts
      - name: Commit formatter output
        run: |
          git add apps/api/src/routes.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(#19): format safe physical evidence projection"
            git push origin HEAD:feat/mtv-19-connected-golden-path
          fi
