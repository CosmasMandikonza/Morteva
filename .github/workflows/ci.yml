name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Cold checkout verify (install, scan, lint, typecheck, test, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Record runtime
        run: node --version && npm --version

      - name: Install (npm ci — verifies the committed lockfile on a cold checkout)
        run: npm ci

      - name: Secret scan
        run: node scripts/check-secrets.mjs

      - name: Documentation integrity
        run: node scripts/check-docs.mjs

      - name: Design token contract (structure, lab traceability, WCAG contrast)
        run: node scripts/check-design-tokens.mjs

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck (tsc, strict)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build (api + packages tsc, web vite)
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # MTV-14 integrated acceptance + MTV-19 adversarial financial journey:
      # REAL multi-actor journeys against the shared seeded demo server — run
      # serially and EXCLUDED from the main smoke step so concurrent journey
      # specs cannot reorder each other's shared-server state (documented D-3
      # interference class). The adversarial spec joined the parallel batch via
      # the 298c5a6 sync and failed there twice at this head while passing
      # serially and in isolation — same class, same bounded fix.
      - name: Integrated viewer acceptance (playwright, serial)
        run: npx playwright test e2e/mission-viewer-integrated.spec.ts --workers=1

      - name: Adversarial financial journey (playwright, serial)
        run: npx playwright test e2e/adversarial-financial-journey.spec.ts --workers=1

      # R-final customer-operated workflow: unseen mission → registered spec →
      # one-time source credential → signed field evidence → journal-derived
      # decision → separate approver → replay. Real multi-actor journeys on the
      # shared seeded server, so they run serially for the same D-3 reason.
      - name: Customer-operated workflow (playwright, serial)
        run: npx playwright test e2e/customer-journey.spec.ts e2e/customer-states.spec.ts --workers=1

      - name: E2E smoke (playwright, real servers)
        run: npx playwright test --grep-invert "mission-viewer-integrated|adversarial-financial-journey|customer-journey|customer-states"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  design-lab:
    name: Design lab verify (VITE_DESIGN_LAB=1 build + founder-preview tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Build all workspaces with the design-lab and mission-viewer entries enabled
        # Full root build (packages + api + web) because the Playwright
        # webServer starts the compiled API alongside vite preview.
        run: npm run build
        env:
          VITE_DESIGN_LAB: '1'
          VITE_MISSION_VIEWER: '1'

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Design-lab interaction tests (lab build)
        run: npx playwright test e2e/design-lab.spec.ts

      - name: Mission-viewer adversarial suite (gated harness build)
        run: npx playwright test e2e/mission-viewer.spec.ts --workers=2

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-design-lab
          path: playwright-report/
          retention-days: 7
