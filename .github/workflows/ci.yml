name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Cold checkout verify (install, scan, lint, typecheck, test, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Record runtime
        run: node --version && npm --version

      - name: Install (npm ci — verifies the committed lockfile on a cold checkout)
        run: npm ci

      - name: Secret scan
        run: node scripts/check-secrets.mjs

      - name: Documentation integrity
        run: node scripts/check-docs.mjs

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Temporary CTO formatting extraction (remove before merge)
        if: failure()
        run: |
          npx prettier --write packages/ledger/src/services/accounts.ts packages/ledger/src/services/mandates.ts packages/ledger/src/services/plans.ts packages/ledger/test/accounts-balance.test.ts packages/ledger/test/evidence-isolation.test.ts packages/ledger/test/lifecycle.test.ts packages/ledger/test/mandates-plans-approvals.test.ts packages/ledger/test/reservations.test.ts packages/ledger/test/restart-replay.test.ts
          node - <<'NODE'
          const fs = require('node:fs');
          for (const path of ['packages/ledger/src/services/accounts.ts', 'packages/ledger/src/services/mandates.ts', 'packages/ledger/src/services/plans.ts', 'packages/ledger/test/accounts-balance.test.ts', 'packages/ledger/test/evidence-isolation.test.ts', 'packages/ledger/test/lifecycle.test.ts', 'packages/ledger/test/mandates-plans-approvals.test.ts', 'packages/ledger/test/reservations.test.ts', 'packages/ledger/test/restart-replay.test.ts']) {
            console.log('FMT_JSON=' + JSON.stringify({ path, content: fs.readFileSync(path, 'utf8') }));
          }
          NODE

      - name: Typecheck (tsc, strict)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build (api + packages tsc, web vite)
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (playwright, real servers)
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
